<style>
:root{
  --paper:#F4F6F2; --surface:#FFFFFF; --panel:#17323B; --ink:#16202A;
  --muted:#6E7C88; --line:#E3E7E2; --safe:#2F7D62; --close:#B8801F; --over:#AE4A3C;
  --mono: ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink); padding-bottom:104px;
  font:400 16px/1.4 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;touch-action:manipulation;cursor:pointer}
input{font-family:inherit;font-size:16px}
.panel{background:var(--panel);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 24px) 20px 20px}
.panel-row{display:flex;align-items:baseline;justify-content:space-between}
.sub{color:#9DB6BC;font-size:12px}
.amount{font-family:var(--mono);font-size:46px;font-weight:600;letter-spacing:-.02em;margin-top:4px}
.big{font-family:var(--mono);font-size:36px;font-weight:600;letter-spacing:-.02em;margin-top:12px}
.rule{height:1px;background:#2C4B55;margin-top:12px}
.hdr-line{color:#C7D8DC;font-size:14px;margin-top:12px}
.warn{color:#F0A79C}
.good{color:#7FC4A6}
.bar{height:6px;border-radius:99px;background:#2C4B55;overflow:hidden;margin-top:8px}
.bar.light{background:#EDF0EC}
.bar > i{display:block;height:100%;border-radius:99px;transition:width .14s ease-out}
.wrap{padding:0 16px}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding-top:16px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 14px;font-size:14px;font-weight:500;color:var(--ink)}
.chip.on{background:var(--panel);border-color:var(--panel);color:#fff}
.chip.used{border-color:var(--safe);color:var(--safe)}
.legs{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.leg{background:#2C4B55;color:#DCE9EC;border:0;border-radius:999px;padding:5px 9px 5px 12px;font-size:12px}
.row2{display:flex;gap:8px;padding-top:16px}
.field{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px;font-size:16px;text-align:left;color:var(--ink)}
.field.ghost{color:var(--muted)}
.datefield{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px;color:var(--ink);min-width:132px}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding-top:12px}
.key{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:14px 0;font-size:24px;font-weight:500;font-family:var(--mono);color:var(--ink)}
.key:active{opacity:.55}
.primary{width:100%;border:0;border-radius:16px;padding:17px;font-size:16px;font-weight:600;color:#fff;background:var(--safe);margin-top:12px}
.primary.dark{background:var(--panel)}
.primary.bad{background:var(--over)}
.primary:disabled{background:#C9D2CC}
.linkbtn{background:none;border:0;font-size:14px;font-weight:500;padding:14px 0 0;color:var(--safe)}
.linkbtn.grey{color:var(--muted)}
.sec{font-size:14px;font-weight:500;margin:24px 0 8px;display:flex;justify-content:space-between;align-items:baseline}
.sec .note{font-size:12px;font-weight:400;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 16px;margin-bottom:8px}
.card .top{display:flex;justify-content:space-between;align-items:baseline}
.meta{font-size:12px;color:var(--muted);margin-top:6px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.li{display:flex;align-items:center;gap:12px;width:100%;padding:13px 16px;background:none;border:0;text-align:left;font-size:14px;color:var(--ink)}
.li + .li{border-top:1px solid var(--line)}
.namebtn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;background:none;border:0;padding:0;text-align:left;font-size:14px}
.namebtn .cap{font-size:11px}
.monthamt{width:74px;text-align:right;font-family:var(--mono);font-size:16px;border:0;background:none;color:var(--ink);outline:none;padding:4px 0}
.li .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.box{width:21px;height:21px;border-radius:6px;border:1px solid #CBD3CD;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;flex:0 0 auto}
.box.on{background:var(--safe);border-color:var(--safe)}
.mono{font-family:var(--mono)}
.x{background:none;border:0;color:var(--muted);font-size:20px;line-height:1;padding:0 4px}
.del{background:none;border:0;color:var(--over);font-size:12px;font-weight:600;padding:0 4px}
.tx{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:6px}
.setrow{display:flex;align-items:center;gap:8px;padding:6px 8px}
.setrow input{border:0;background:none;color:var(--ink);padding:4px 0;min-width:0;outline:none}
.setrow .nm{flex:1}
.setrow .amt{width:78px;text-align:right;font-family:var(--mono)}
.setrow .day{width:42px;text-align:right;font-family:var(--mono);color:var(--muted)}
.autopill{border:1px solid var(--line);background:none;color:var(--muted);border-radius:999px;padding:3px 8px;font-size:11px;font-weight:600;letter-spacing:.02em}
.autopill.on{border-color:var(--safe);color:var(--safe);background:rgba(47,125,98,.08)}
.schedgrid{display:flex;flex-wrap:wrap;gap:4px;padding:4px 8px 6px}
.mchip{border:1px solid var(--line);background:none;border-radius:8px;padding:6px 8px;font-size:11px;color:var(--muted);min-width:40px}
.mchip.on{border-color:var(--safe);color:var(--safe);background:#EAF2EE;font-weight:600}
.schedhint{font-size:11px;color:var(--muted);padding:0 8px 6px}
.recitem{border-bottom:1px solid var(--line);padding:4px 0}
.recitem:last-child{border-bottom:0}
.caption{font-size:12px;color:var(--muted);margin:-2px 0 8px}
.setbox{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px}
.addrow{border-top:1px solid var(--line);margin-top:4px;padding-top:6px}
.receipt{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:24px;margin-top:48px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:24px}
.stat b{display:block;font-family:var(--mono);font-size:20px;font-weight:600}
.stat span{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.legrow{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tab{flex:1;border:0;background:none;padding:15px 0;font-size:14px;font-weight:500;color:var(--muted);border-top:2px solid transparent}
.tab.on{color:var(--ink);border-top-color:var(--panel)}
.empty{color:var(--muted);font-size:14px;padding:16px 2px}
.actions{display:flex;gap:8px}
.actions button{flex:1;border-radius:12px;padding:13px;font-size:14px;font-weight:600}
.ghostbtn{background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.darkbtn{background:var(--panel);border:0;color:#fff}
</style>
</head>
<body>
<div id="app"></div>
<input type="file" id="restore" accept="application/json,.json" style="display:none">
<script>
"use strict";
var KEY = "budget-tracker-v1";
var MONO = "var(--mono)";

function uid(){ return Math.random().toString(36).slice(2,10); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function money(n, cents){
  if(cents===undefined) cents = true;
  var v = Math.abs(n||0);
  var s = v.toLocaleString("en-US",{minimumFractionDigits:cents?2:0,maximumFractionDigits:cents?2:0});
  return (n<0 ? "-$" : "$") + s;
}
function pad(n){ return String(n).padStart(2,"0"); }
function todayISO(){ var d=new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function monthKey(iso){ return iso.slice(0,7); }
function monthLabel(mk){ var p=mk.split("-"); return new Date(+p[0],+p[1]-1,1).toLocaleDateString("en-US",{month:"long",year:"numeric"}); }
function shiftMonth(mk,n){ var p=mk.split("-"); var d=new Date(+p[0],+p[1]-1+n,1); return d.getFullYear()+"-"+pad(d.getMonth()+1); }
function daysInMonth(mk){ var p=mk.split("-"); return new Date(+p[0],+p[1],0).getDate(); }
function daysLeftIn(mk){
  var now=new Date(), cur=now.getFullYear()+"-"+pad(now.getMonth()+1);
  if(mk>cur) return daysInMonth(mk);
  if(mk<cur) return 0;
  return daysInMonth(mk)-now.getDate()+1;
}
function ordinal(n){ var s=["th","st","nd","rd"], v=n%100; return n+(s[(v-20)%10]||s[v]||s[0]); }
function statusColor(p){ return p>100 ? "var(--over)" : p>80 ? "var(--close)" : "var(--safe)"; }
function shortDate(iso){ var p=iso.split("-"); return new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString("en-US",{month:"short",day:"numeric"}); }

function seed(){
  var cats = [["Groceries",900],["Coffee & snacks",75],["Dining out",400],["Gas",200],
              ["Household",150],["Golf",150],["Shopping",200],["Fun",150],["Everything else",100]];
  var recs = [["Payroll",0,21,"income","before"],["Rent #1",0,31,"income",""],
              ["Rent #2",0,1,"income",""],["Rent #3",0,14,"income",""],
              ["Mortgage",0,1,"bill",""],["Electric",0,10,"bill",""],
              ["Gas / heat",0,12,"bill",""],["Water / sewer",0,20,"bill",""],
              ["Internet",0,5,"bill",""],["Phone",0,8,"bill",""],["Insurance",0,1,"bill",""]];
  return {
    version:1,
    categories: cats.map(function(c){ return {id:uid(),name:c[0],budget:c[1]}; }),
    recurring: recs.map(function(r){
      return {id:uid(),name:r[0],amount:r[1],day:r[2],type:r[3],wknd:r[4],auto:true};
    }),
    transactions: [], paidBills:{}, unpaidBills:{}, amounts:{}, snapshots:{}, meta:{lastBackup:null}
  };
}

/* ---------- state ---------- */
var S = {
  data: null, tab:"spend", mk: monthKey(todayISO()), armed:null,
  spend:{ catId:null, amount:"", note:"", date: todayISO(), showNote:false, splitTotal:null, legs:[],
          reimb:"", showReimb:false, receipt:null },
  draft:{ cat:{name:"",amount:""}, bill:{name:"",amount:""}, income:{name:"",amount:""} },
  openSched:null,
  flash:null
};

function load(){
  var raw=null;
  try { raw = localStorage.getItem(KEY); } catch(e){}
  var d = raw ? JSON.parse(raw) : seed();
  if(!d.paidBills) d.paidBills={};
  if(!d.unpaidBills) d.unpaidBills={};
  if(!d.amounts) d.amounts={};
  if(!d.snapshots) d.snapshots={};
  if(!d.meta) d.meta={lastBackup:null};
  S.data=d;
  S.spend.catId = d.categories.length ? d.categories[0].id : null;
  syncSnapshot();
  save();
}

/* The current month's planned figures are mirrored into snapshots on every save.
   Once the month turns over, its entry is never touched again, so history keeps
   the budgets that were actually in force at the time. */
function snapItems(){
  var out=[];
  var mk = monthKey(todayISO());
  S.data.categories.forEach(function(c){
    out.push({id:c.id, name:c.name, type:"Category", planned:c.budget||0});
  });
  S.data.recurring.forEach(function(r){
    out.push({id:r.id, name:r.name, type: r.type==="bill"?"Bill":"Income",
              planned:plannedFor(r,mk), day:r.day||1, wknd:r.wknd||"", auto:r.auto!==false,
              months:(r.months && r.months.length && r.months.length<12) ? r.months.slice() : null,
              reserve:!!r.reserve, reserveFrom:r.reserveFrom||null});
  });
  return out;
}
function syncSnapshot(){
  if(!S.data.snapshots) S.data.snapshots={};
  S.data.snapshots[monthKey(todayISO())] = snapItems();
}
function save(){
  try { syncSnapshot(); localStorage.setItem(KEY, JSON.stringify(S.data)); }
  catch(e){ S.flash = "Couldn't save — storage is full or blocked."; }
}

/* Anything recurring lands on a date. Auto items settle themselves once that
   date arrives; an explicit tap always wins, for that month only. Amounts can
   be overridden per month for anything that isn't the same every time. */
function plannedFor(item, mk){
  var o = (S.data.amounts && S.data.amounts[mk]) || {};
  return (o[item.id] === undefined || o[item.id] === null) ? (item.amount||0) : o[item.id];
}
var MONTH_ABBR = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function everyMonth(item){
  return !item.months || !item.months.length || item.months.length===12;
}
function dueInMonthNo(item, n){
  return everyMonth(item) ? true : item.months.indexOf(n) > -1;
}
function dueThisMonth(item, mk){
  return dueInMonthNo(item, +mk.split("-")[1]);
}
function schedLabel(item){
  if(everyMonth(item)) return "monthly";
  var ms = item.months.slice().sort(function(a,b){ return a-b; });
  if(ms.length <= 4) return ms.map(function(m){ return MONTH_ABBR[m-1]; }).join(" ");
  return ms.length + "×/yr";
}
function perYear(item){
  return (everyMonth(item) ? 12 : item.months.length) * (item.amount||0);
}

/* A reserved item is funded by a monthly set-aside rather than out of the month
   it falls in. Balance = every contribution since the reserve was switched on,
   less every payment that has actually gone out in that window. */
/* An expense that is coming back only counts against the budget for the part
   you actually carry. The whole amount still leaves the account this month;
   the refund lands as cash in whatever month it turns up. */
function reimbOf(t){ return t.reimb || 0; }
function netOf(t){ return t.amount - reimbOf(t); }
function pendingReimb(){
  return S.data.transactions.filter(function(t){ return reimbOf(t)>0 && !t.reimbGot; })
    .sort(function(a,b){ return a.date<b.date?-1:1; });
}

function reserveMonthly(item){
  return perYear(item)/12;
}
function reserveBalance(item, mk){
  var from = item.reserveFrom || monthKey(todayISO());
  if(mk < from) return 0;
  var bal = 0, m = from, guard = 0;
  while(guard++ < 600){
    bal += reserveMonthly(item);
    if(dueThisMonth(item, m) && settled(item, m)) bal -= plannedFor(item, m);
    if(m >= mk) break;
    m = shiftMonth(m, 1);
  }
  return bal;
}
function reserveBeforePayment(item, mk){
  var from = item.reserveFrom || monthKey(todayISO());
  var prior = mk <= from ? 0 : reserveBalance(item, shiftMonth(mk,-1));
  return prior + reserveMonthly(item);
}
function nextDue(item, mk){
  var m = mk;
  for(var i=0; i<13; i++){
    if(dueThisMonth(item, m) && (i>0 || !settled(item, m))) return m;
    m = shiftMonth(m, 1);
  }
  return null;
}

function arrivalDay(day, wknd, mk){
  var parts = mk.split("-"), y = +parts[0], m = +parts[1], dim = daysInMonth(mk);
  var d = Math.min(day||1, dim);
  if(wknd === "before" || wknd === "after"){
    var dow = new Date(y, m-1, d).getDay();
    if(wknd === "before"){ if(dow === 6) d -= 1; else if(dow === 0) d -= 2; }
    else { if(dow === 6) d += 2; else if(dow === 0) d += 1; }
    d = Math.max(1, Math.min(d, dim));
  }
  return d;
}
function arrivalLabel(item, mk){
  var d = arrivalDay(item.day, item.wknd, mk);
  var parts = mk.split("-");
  var dow = new Date(+parts[0], +parts[1]-1, d).toLocaleDateString("en-US",{weekday:"short"});
  var shifted = d !== Math.min(item.day||1, daysInMonth(mk));
  return ordinal(d) + (shifted ? " ("+dow+")" : "");
}
function dueReached(item, mk){
  var cur = monthKey(todayISO());
  if(mk < cur) return true;
  if(mk > cur) return false;
  return new Date().getDate() >= arrivalDay(item.day, item.wknd, mk);
}
function settled(item, mk){
  if((S.data.paidBills[mk]||[]).indexOf(item.id) > -1) return true;
  if((S.data.unpaidBills[mk]||[]).indexOf(item.id) > -1) return false;
  if(item.auto === false) return false;
  return dueReached(item, mk);
}
function isOverridden(id, mk){
  return (S.data.paidBills[mk]||[]).indexOf(id) > -1 ||
         (S.data.unpaidBills[mk]||[]).indexOf(id) > -1;
}
function setSettled(id, mk, yes){
  var pd = (S.data.paidBills[mk]||[]).filter(function(x){ return x!==id; });
  var un = (S.data.unpaidBills[mk]||[]).filter(function(x){ return x!==id; });
  if(yes) pd.push(id); else un.push(id);
  S.data.paidBills[mk]=pd; S.data.unpaidBills[mk]=un;
}

function stats(){
  var d=S.data, mk=S.mk;
  var tx = d.transactions.filter(function(t){ return monthKey(t.date)===mk; });
  var byCat={}; tx.forEach(function(t){ byCat[t.categoryId]=(byCat[t.categoryId]||0)+netOf(t); });
  var spent = tx.reduce(function(a,t){ return a+netOf(t); },0);
  var cashOut = tx.reduce(function(a,t){ return a+t.amount; },0);
  var reimbIn = d.transactions.reduce(function(a,t){
    return a + ((t.reimbGot && monthKey(t.reimbGot)===mk) ? reimbOf(t) : 0); },0);
  var pend = pendingReimb();
  var pendTotal = pend.reduce(function(a,t){ return a+reimbOf(t); },0);
  var budgeted = d.categories.reduce(function(a,c){ return a+(c.budget||0); },0);

  var bySort = function(a,b){ return arrivalDay(a.day,a.wknd,mk) - arrivalDay(b.day,b.wknd,mk); };
  var due = function(r){ return dueThisMonth(r, mk); };
  var billList = d.recurring.filter(function(r){ return r.type==="bill" && due(r); }).sort(bySort);
  var incomeList = d.recurring.filter(function(r){ return r.type==="income" && due(r); }).sort(bySort);

  var isPaid={}, isIn={};
  billList.forEach(function(r){ isPaid[r.id]=settled(r,mk); });
  incomeList.forEach(function(r){ isIn[r.id]=settled(r,mk); });

  var sum = function(list, only){
    return list.reduce(function(a,r){
      return a + ((!only || only[r.id]) ? plannedFor(r,mk) : 0); },0);
  };
  var bills = sum(billList), billsPaid = sum(billList, isPaid);
  var income = sum(incomeList), incomeIn = sum(incomeList, isIn);

  var reserveList = d.recurring.filter(function(r){
    return r.type==="bill" && r.reserve && (!r.reserveFrom || mk >= r.reserveFrom);
  });
  var contrib = reserveList.reduce(function(a,r){ return a+reserveMonthly(r); },0);
  var shortfall = reserveList.reduce(function(a,r){
    if(!dueThisMonth(r, mk)) return a;
    return a + Math.max(0, plannedFor(r,mk) - reserveBeforePayment(r, mk));
  },0);
  var billsCash = billList.reduce(function(a,r){
    return a + (r.reserve ? 0 : plannedFor(r,mk)); },0);
  var monthlyOutflow = billsCash + contrib + shortfall;

  var left = budgeted-spent, dl = daysLeftIn(mk);
  return { tx:tx, byCat:byCat, spent:spent, cashOut:cashOut, reimbIn:reimbIn,
           pending:pend, pendTotal:pendTotal, budgeted:budgeted,
           billList:billList, incomeList:incomeList, isPaid:isPaid, isIn:isIn,
           bills:bills, billsPaid:billsPaid, billsUnpaid:bills-billsPaid,
           income:income, incomeIn:incomeIn,
           left:left, daysLeft:dl, perDay:left/Math.max(dl,1),
           reserveList:reserveList, contrib:contrib, shortfall:shortfall,
           monthlyOutflow:monthlyOutflow,
           cushion:income-monthlyOutflow-budgeted,
           afterBills:income+reimbIn-monthlyOutflow-cashOut };
}

/* ---------- spend ---------- */
function spendState(){
  var sp=S.spend, st=stats();
  var cat = S.data.categories.filter(function(c){ return c.id===sp.catId; })[0];
  var val = parseFloat(sp.amount||"0")||0;
  var splitting = sp.splitTotal!==null;
  var allocated = sp.legs.reduce(function(a,l){ return a+l.amount; },0);
  var remaining = splitting ? Math.round((sp.splitTotal-allocated)*100)/100 : 0;
  var legHere = sp.legs.filter(function(l){ return l.categoryId===sp.catId; })
                       .reduce(function(a,l){ return a+l.amount; },0);
  var spentInCat = (st.byCat[sp.catId]||0)+legHere;
  var rb = splitting ? 0 : Math.min(parseFloat(sp.reimb||"0")||0, val);
  return { st:st, cat:cat, val:val, splitting:splitting, remaining:remaining,
           over: splitting && val>remaining+0.0001, spentInCat:spentInCat, reimb:rb,
           projected: spentInCat+val-rb, budget: cat?(cat.budget||0):0 };
}

  }
  h += '</div>';
  if(v.cat && v.budget>0){
    h += '<div class="bar"><i style="width:'+Math.min(pct,100)+'%;background:'+(pct>100?"#E08878":"#7FC4A6")+'"></i></div>';
  }
  h += '</div>';

  h += '<div class="wrap"><div class="chips">';
  S.data.categories.forEach(function(c){
    var on = c.id===sp.catId;
    var used = sp.legs.some(function(l){ return l.categoryId===c.id; });

    h += '<button class="chip'+(on?" on":"")+(!on&&used?" used":"")+'" data-act="cat" data-id="'+c.id+'">'+
         esc(c.name)+(over?' <span style="color:'+(on?"#F0A79C":"var(--over)")+'">·</span>':"")+'</button>';
  });
  h += '</div>';

  h += '<div class="row2">';
  if(sp.showNote){
    h += '<input class="field" id="noteinput" data-edit="note" placeholder="What was it?" value="'+esc(sp.note)+'">';
  } else {
    h += '<button class="field'+(sp.note?"":" ghost")+'" data-act="opennote">'+(sp.note?esc(sp.note):"Add a note")+'</button>';
  }
  h += '<input type="date" class="datefield" data-edit="date" value="'+sp.date+'">';
  h += '</div>';

  if(!v.splitting && sp.showReimb){
    h += '<div class="row2" style="align-items:center">'+
         '<span style="font-size:14px;color:var(--muted);padding-top:16px">Coming back to me</span>'+
         '<span style="flex:1"></span>'+
         '<span style="color:var(--muted);font-family:var(--mono);padding-top:16px">$</span>'+
         '<input class="datefield" style="width:110px;text-align:right;font-family:var(--mono);margin-top:16px" '+
           'inputmode="decimal" data-edit="reimb" value="'+esc(sp.reimb)+'" placeholder="0">'+
         '</div>';
    if(v.reimb>0 && v.cat){
      h += '<div class="meta" style="margin-top:6px">'+money(v.val-v.reimb)+' counts against '+esc(v.cat.name)+
           ' · '+money(v.reimb)+' tracked as owed to you</div>';
    }
  }
  if(v.splitting){
    h += '<button class="linkbtn grey" data-act="cancelsplit">Cancel split</button>';
  } else {
    h += '<button class="linkbtn'+(v.val>0?"":" grey")+'" data-act="startsplit"'+(v.val>0?"":" disabled")+'>'+
         (v.val>0 ? "Split "+money(v.val)+" across categories" : "Enter a total to split it")+'</button>';
    h += '<span style="display:inline-block;width:16px"></span>';
    h += '<button class="linkbtn'+(sp.showReimb?"":" grey")+'" data-act="togglereimbfield">'+
         (sp.showReimb ? "Not reimbursable" : "Getting reimbursed")+'</button>';
  }

  h += '<div class="keys">';
  ["1","2","3","4","5","6","7","8","9",".","0","del"].forEach(function(k){
    h += '<button class="key" data-act="key" data-k="'+k+'">'+(k==="del"?"⌫":k)+'</button>';
  });
  h += '</div>';

  var label, ready;
  if(!v.splitting){ label = "Save "+(v.val>0?money(v.val):""); ready = v.val>0 && !!v.cat; }
  else if(v.over){ label = "Over by "+money(v.val-v.remaining,false); ready=false; }
  else if(v.val>0 && v.val<v.remaining){ label = "Add "+money(v.val)+" to "+(v.cat?v.cat.name:""); ready=true; }
  else { label = "Save split · "+money(sp.splitTotal); ready = v.val>0 || (v.remaining===0 && sp.legs.length>0); }

  h += '<button class="primary'+(v.over?" bad":"")+'" data-act="save"'+(ready?"":" disabled")+'>'+esc(label)+'</button>';
  h += '</div>';
  return h;
}

/* ---------- month ---------- */

  var cur = monthKey(todayISO());
  h += '<div class="panel">';
  h += '<div class="panel-row" style="align-items:center">'+
       '<button class="x" style="color:#9DB6BC;font-size:22px" data-act="prevmonth">‹</button>'+

       '<button class="x" style="color:#9DB6BC;font-size:22px;opacity:'+(S.mk>=cur?".3":"1")+'" data-act="nextmonth"'+(S.mk>=cur?" disabled":"")+'>›</button></div>';

         '<div class="meta">'+money(s,false)+' of '+(c.budget?money(c.budget,false):"—")+
         (c.budget>0 ? ' · '+Math.round(pct)+'% used' : '')+
         (c.budget>0 && st.daysLeft>0 ? ' · '+money(Math.max((c.budget-s)/st.daysLeft,0),false)+'/day' : '')+
         '</div></div>';
  });

  h += recurringSection("Bills", st.billList, st.isPaid,

      var bal = reserveBalance(r, S.mk), dueNow = dueThisMonth(r, S.mk);
      var need = plannedFor(r, S.mk), have = reserveBeforePayment(r, S.mk);
      var short = dueNow ? Math.max(0, need-have) : 0;
      var nxt = nextDue(r, S.mk);
      var cap = dueNow
        ? (short>0 ? "short "+money(short,false)+" for the "+arrivalLabel(r,S.mk)
                   : "drawn "+arrivalLabel(r,S.mk)+" · "+money(need,false))
        : (nxt ? "next "+MONTH_ABBR[+nxt.split("-")[1]-1]+" "+arrivalLabel(r,nxt)+" · "+money(plannedFor(r,nxt),false)
               : "no payment scheduled");

           '</button>'+

    var c = d.categories.filter(function(x){ return x.id===t.categoryId; })[0];

           (t.group?" · split":"")+
           (reimbOf(t)>0 ? ' · '+money(reimbOf(t),false)+(t.reimbGot?" back":" due back") : "")+'</div>'+

         '<span class="mono" style="font-size:14px">'+money(t.amount)+'</span>'+

            : '<button class="x" data-act="armtx" data-id="'+t.id+'">×</button>')+
         '</div></div>';
  });
  h += '</div>';
  return h;

function recurringSection(title, list, state, noteText, emptyText){
  var cur = monthKey(todayISO()), h="";
  h += '<div class="sec"><span>'+title+'</span><span class="note">'+noteText+'</span></div>';
  h += '<div class="list">';
  if(!list.length) h += '<div class="empty" style="padding:16px">'+emptyText+'</div>';
  list.forEach(function(r){
    var on = state[r.id], auto = r.auto!==false, manual = isOverridden(r.id, S.mk);
    var day = arrivalDay(r.day, r.wknd, S.mk);
    var late = !on && S.mk===cur && day < new Date().getDate();
    var verb = r.type==="bill" ? "cleared" : "in";
    var label = on ? (manual ? "marked "+verb : verb+" "+arrivalLabel(r, S.mk))
                   : late ? (r.type==="bill" ? "past due" : "not in yet")
                          : "due "+arrivalLabel(r, S.mk);
    h += '<div class="li">'+
         '<button class="box'+(on?" on":"")+'" data-act="toggleitem" data-id="'+r.id+'">'+(on?"✓":"")+'</button>'+
         '<button class="grow namebtn" data-act="toggleitem" data-id="'+r.id+'">'+
           '<span style="color:'+(on?"var(--muted)":"var(--ink)")+'">'+esc(r.name)+
           (auto?' <span style="font-size:11px;color:var(--safe)">auto</span>':'')+
           (r.reserve?' <span style="font-size:11px;color:var(--muted)">reserve</span>':'')+'</span>'+
           '<span class="cap" style="color:'+(late?"var(--over)":"var(--muted)")+'">'+label+'</span>'+
         '</button>'+
         '<span style="color:var(--muted);font-family:var(--mono);font-size:13px">$</span>'+
         '<input class="monthamt" inputmode="decimal" data-edit="monthamt" data-id="'+r.id+'" '+
           'value="'+(plannedFor(r,S.mk)||"")+'" placeholder="0">'+
         '</div>';
  });
  return h+'</div>';
}

/* ---------- setup ---------- */
function setRow(kind, r, withDay){
  var h = '<div class="setrow">';
  h += '<input class="nm" data-edit="'+kind+':name" data-id="'+r.id+'" value="'+esc(r.name)+'">';

        : '<button class="x" data-act="armrow" data-kind="'+kind+'" data-id="'+r.id+'">×</button>');

/* ---------- shell ---------- */
function render(){
  var h = "";
  if(S.tab==="spend") h = S.spend.receipt ? renderReceipt() : renderSpend();
  else if(S.tab==="month") h = renderMonth();
  else h = renderSetup();

  h += '<div class="tabs">'+
    ["spend","month","setup"].map(function(t){
      var label = t.charAt(0).toUpperCase()+t.slice(1);
      return '<button class="tab'+(S.tab===t?" on":"")+'" data-act="tab" data-t="'+t+'">'+label+'</button>';
    }).join("")+'</div>';

  if(S.flash) h += '<div style="position:fixed;left:16px;right:16px;bottom:80px;background:var(--over);color:#fff;padding:12px 16px;border-radius:12px;font-size:14px">'+esc(S.flash)+'</div>';
  document.getElementById("app").innerHTML = h;
  if(S.spend.showNote && S.tab==="spend" && !S.spend.receipt){
    var n = document.getElementById("noteinput");
    if(n && document.activeElement!==n){ n.focus(); }
  }
}

/* ---------- actions ---------- */
function pressKey(k){
  var sp=S.spend;
  if(k==="del"){ sp.amount = sp.amount.slice(0,-1); return; }
  if(k==="."){ if(sp.amount.indexOf(".")>-1) return; sp.amount = sp.amount===""?"0.":sp.amount+"."; return; }
  if(sp.amount.indexOf(".")>-1 && sp.amount.split(".")[1].length>=2) return;
  if(sp.amount.replace(".","").length>=7) return;
  sp.amount = sp.amount==="0" ? k : sp.amount+k;
}

function legReceipt(categoryId, amt, prior, st, date, reimb){
  amt = amt - (reimb||0);
  var c = S.data.categories.filter(function(x){ return x.id===categoryId; })[0];
  var newSpent = (st.byCat[categoryId]||0)+prior+amt;
  var dl = Math.max(daysLeftIn(monthKey(date)),1);
  var b = c ? (c.budget||0) : 0;
  return { cat: c?c.name:"Uncategorized", amount:amt, budget:b, spent:newSpent,
           left:b-newSpent, pct: b ? (newSpent/b)*100 : null, perDay:(b-newSpent)/dl };
}

function commit(){
  var sp=S.spend, v=spendState();
  var all = v.splitting
    ? sp.legs.concat(v.val>0 ? [{categoryId:sp.catId, amount:v.val}] : [])
    : [{categoryId:sp.catId, amount:v.val}];
  if(!all.length || !v.cat) return;
  if(all.some(function(l){ return l.amount<=0; })) return;
  var total = all.reduce(function(a,l){ return a+l.amount; },0);
  if(v.splitting && Math.abs(sp.splitTotal-total)>0.004) return;

  var group = v.splitting ? uid() : null;
  var desc = sp.note.trim() || (v.splitting ? "Split purchase" : v.cat.name);
  var rb = v.splitting ? 0 : Math.min(parseFloat(sp.reimb||"0")||0, v.val);
  var txs = all.map(function(l){
    return {id:uid(), date:sp.date, desc:desc, categoryId:l.categoryId, amount:l.amount,
            group:group, reimb: rb>0 ? rb : 0, reimbGot:null};
  });
  var st = v.st;
  S.data.transactions = txs.concat(S.data.transactions);
  save();

  var running={};
  var legs = all.map(function(l){
    var prior = running[l.categoryId]||0;
    running[l.categoryId] = prior+l.amount;
    return legReceipt(l.categoryId, l.amount, prior, st, sp.date, rb);
  });
  sp.receipt = { desc:desc, total:total, reimb:rb, daysLeft:daysLeftIn(monthKey(sp.date)), legs:legs };
  sp.amount=""; sp.note=""; sp.showNote=false; sp.date=todayISO(); sp.splitTotal=null; sp.legs=[];
  sp.reimb=""; sp.showReimb=false;
  setTimeout(function(){ if(S.spend.receipt){ S.spend.receipt=null; render(); } }, 7000);
}

function q(v){ return '"'+String(v).replace(/"/g,'""')+'"'; }

function monthsWithData(){
  var set={};
  S.data.transactions.forEach(function(t){ set[monthKey(t.date)]=1; });
  Object.keys(S.data.paidBills||{}).forEach(function(m){ set[m]=1; });
  set[monthKey(todayISO())]=1;
  return Object.keys(set).sort();
}

function summaryCsv(){
  var d=S.data;
  var rows=[["Month","Type","Item","Planned","Actual","Remaining","Pct Used"]];
  monthsWithData().forEach(function(mk){
    var tx = d.transactions.filter(function(t){ return monthKey(t.date)===mk; });
    var byCat={}; tx.forEach(function(t){ byCat[t.categoryId]=(byCat[t.categoryId]||0)+t.amount; });
    var items = (d.snapshots && d.snapshots[mk]) ? d.snapshots[mk] : snapItems();
    var seen = {};
    items.forEach(function(it){
      seen[it.id]=1;
      if((it.type==="Bill" || it.type==="Income") && !dueThisMonth(it, mk)){ seen[it.id]=1; return; }
      var planned = it.planned||0, actual, remaining;
      actual = (it.type==="Bill" || it.type==="Income")
        ? (settled(it, mk) ? planned : 0)
        : (byCat[it.id]||0);
      remaining = planned-actual;
      rows.push([mk,it.type,q(it.name),planned.toFixed(2),actual.toFixed(2),remaining.toFixed(2),
                 planned>0 ? ((actual/planned)*100).toFixed(1) : ""]);
    });
    var backIn = d.transactions.reduce(function(a,t){
      return a + ((t.reimbGot && monthKey(t.reimbGot)===mk) ? reimbOf(t) : 0); },0);
    if(backIn>0) rows.push([mk,"Reimbursement",q("Received"),"0.00",backIn.toFixed(2),"",""]);
    d.recurring.filter(function(r){
      return r.type==="bill" && r.reserve && (!r.reserveFrom || mk >= r.reserveFrom);
    }).forEach(function(r){
      var mo = reserveMonthly(r);
      rows.push([mk,"Reserve",q(r.name),mo.toFixed(2),mo.toFixed(2),
                 reserveBalance(r,mk).toFixed(2),""]);
    });
    Object.keys(byCat).forEach(function(cid){
      if(seen[cid]) return;
      var c = d.categories.filter(function(x){ return x.id===cid; })[0];
      rows.push([mk,"Category",q(c?c.name:"Deleted category"),"0.00",byCat[cid].toFixed(2),
                 (-byCat[cid]).toFixed(2),""]);
    });
  });
  return rows.map(function(r){ return r.join(","); }).join("\n");
}

function shareCsv(name, text){
  try{
    var file = new File([text], name, {type:"text/csv"});
    if(navigator.share && navigator.canShare && navigator.canShare({files:[file]})){
      navigator.share({files:[file], title:name}).catch(function(){});
      return;
    }
  } catch(e){}
  downloadFile(name, text, "text/csv");
}

function csvText(){
  var rows = [["Date","Description","Category","Amount","Reimbursable","Reimbursed On","Net"]];
  S.data.transactions.slice().sort(function(a,b){ return a.date<b.date?-1:1; }).forEach(function(t){
    var c = S.data.categories.filter(function(x){ return x.id===t.categoryId; })[0];
    rows.push([t.date, '"'+t.desc.replace(/"/g,'""')+'"', c?c.name:"Uncategorized", t.amount.toFixed(2),
               reimbOf(t).toFixed(2), t.reimbGot||"", netOf(t).toFixed(2)]);
  });
  return rows.map(function(r){ return r.join(","); }).join("\n");
}
function downloadFile(name, text, type){
  var blob = new Blob([text], {type:type});
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
}

document.addEventListener("click", function(e){
  var el = e.target.closest("[data-act]");
  if(!el) return;
  var act = el.dataset.act, sp = S.spend;
  S.flash = null;

  if(act==="tab"){ S.tab = el.dataset.t; S.armed=null; }
  else if(act==="key"){ pressKey(el.dataset.k); }
  else if(act==="cat"){ sp.catId = el.dataset.id; }
  else if(act==="opennote"){ sp.showNote = true; }
  else if(act==="togglereimbfield"){
    sp.showReimb = !sp.showReimb;
    sp.reimb = sp.showReimb ? (sp.amount||"") : "";
  }
  else if(act==="togglereimbgot"){
    var rt = S.data.transactions.filter(function(x){ return x.id===el.dataset.id; })[0];
    if(rt){ rt.reimbGot = rt.reimbGot ? null : todayISO(); save(); }
  }
  else if(act==="startsplit"){
    var val = parseFloat(sp.amount||"0")||0;
    if(val<=0) return;
    sp.splitTotal = val; sp.legs=[]; sp.amount="";
  }
  else if(act==="cancelsplit"){ sp.amount = sp.splitTotal ? String(sp.splitTotal) : ""; sp.splitTotal=null; sp.legs=[]; }
  else if(act==="dropleg"){
    sp.legs.splice(+el.dataset.i,1);
    var rem = Math.round((sp.splitTotal - sp.legs.reduce(function(a,l){ return a+l.amount; },0))*100)/100;
    sp.amount = rem>0 ? String(rem) : "";
  }
  else if(act==="save"){
    var v = spendState();
    if(v.splitting && v.val>0 && v.val<v.remaining){
      sp.legs.push({categoryId:sp.catId, amount:v.val});
      var r2 = Math.round((sp.splitTotal - sp.legs.reduce(function(a,l){ return a+l.amount; },0))*100)/100;
      sp.amount = r2>0 ? String(r2) : "";
    } else { commit(); }
  }
  else if(act==="closereceipt"){ sp.receipt = null; }
  else if(act==="prevmonth"){ S.mk = shiftMonth(S.mk,-1); }
  else if(act==="nextmonth"){ S.mk = shiftMonth(S.mk,1); }
  else if(act==="toggleitem"){
    var rec = S.data.recurring.filter(function(x){ return x.id===el.dataset.id; })[0];
    if(rec){ setSettled(rec.id, S.mk, !settled(rec, S.mk)); save(); }
  }
  else if(act==="toggleauto"){
    var ar = S.data.recurring.filter(function(x){ return x.id===el.dataset.id; })[0];
    if(ar){ ar.auto = ar.auto===false; save(); }
  }
  else if(act==="opensched"){
    S.openSched = S.openSched===el.dataset.id ? null : el.dataset.id;
  }
  else if(act==="schedmonth"){
    var si = S.data.recurring.filter(function(x){ return x.id===el.dataset.id; })[0];
    var m = +el.dataset.m;
    if(si){
      var ms = everyMonth(si) ? null : si.months.slice();
      if(!ms){ ms = [m]; }
      else if(ms.indexOf(m) > -1){ ms = ms.filter(function(x){ return x!==m; }); }
      else { ms.push(m); }
      si.months = (!ms || !ms.length || ms.length===12) ? null : ms;
      save();
    }
  }
  else if(act==="togglereserve"){
    var rr = S.data.recurring.filter(function(x){ return x.id===el.dataset.id; })[0];
    if(rr){
      rr.reserve = !rr.reserve;
      if(rr.reserve && !rr.reserveFrom) rr.reserveFrom = monthKey(todayISO());
      save();
    }
  }
  else if(act==="togglewknd"){
    var wr = S.data.recurring.filter(function(x){ return x.id===el.dataset.id; })[0];
    if(wr){ wr.wknd = wr.wknd==="before" ? "after" : wr.wknd==="after" ? "" : "before"; save(); }
  }
  else if(act==="armtx"){ S.armed = "tx:"+el.dataset.id; }
  else if(act==="deltx"){
    var t = S.data.transactions.filter(function(x){ return x.id===el.dataset.id; })[0];
    if(t){
      S.data.transactions = S.data.transactions.filter(function(x){
        return t.group ? x.group!==t.group : x.id!==t.id; });
      save();
    }
    S.armed=null;
  }
  else if(act==="armrow"){ S.armed = el.dataset.kind+":"+el.dataset.id; }
  else if(act==="delrow"){
    var k = el.dataset.kind, rid = el.dataset.id;
    if(k==="cat") S.data.categories = S.data.categories.filter(function(c){ return c.id!==rid; });
    else S.data.recurring = S.data.recurring.filter(function(r){ return r.id!==rid; });
    if(sp.catId===rid) sp.catId = S.data.categories.length ? S.data.categories[0].id : null;
    S.armed=null; save();
  }
  else if(act==="add"){
    var kind = el.dataset.kind, dr = S.draft[kind];
    if(!dr.name.trim()) return;
    var amt = parseFloat(dr.amount)||0;
    if(kind==="cat") S.data.categories.push({id:uid(), name:dr.name.trim(), budget:amt});
    else S.data.recurring.push({id:uid(), name:dr.name.trim(), amount:amt, day:1, type: kind==="bill"?"bill":"income"});
    S.draft[kind] = {name:"", amount:""};
    save();
  }
  else if(act==="csv"){ downloadFile("transactions-"+todayISO()+".csv", csvText(), "text/csv"); }
  else if(act==="sumcsv"){ downloadFile("budget-summary-"+todayISO()+".csv", summaryCsv(), "text/csv"); }
  else if(act==="sharetx"){ shareCsv("transactions-"+todayISO()+".csv", csvText()); return; }
  else if(act==="sharesum"){ shareCsv("budget-summary-"+todayISO()+".csv", summaryCsv()); return; }
  else if(act==="copycsv"){
    var txt = csvText();
    if(navigator.clipboard) navigator.clipboard.writeText(txt).then(function(){ S.flash="CSV copied."; render();
      setTimeout(function(){ S.flash=null; render(); }, 1800); });
    return;
  }
  else if(act==="backup"){
    downloadFile("budget-backup-"+todayISO()+".json", JSON.stringify(S.data), "application/json");
    S.data.meta.lastBackup = Date.now(); save();
  }
  else if(act==="restore"){ document.getElementById("restore").click(); return; }
  else return;

  render();
});

document.addEventListener("input", function(e){
  var el = e.target;
  if(el.dataset.edit){
    var parts = el.dataset.edit.split(":"), kind = parts[0], field = parts[1], id = el.dataset.id;
    if(kind==="monthamt"){
      if(!S.data.amounts[S.mk]) S.data.amounts[S.mk]={};
      if(el.value==="") delete S.data.amounts[S.mk][el.dataset.id];
      else S.data.amounts[S.mk][el.dataset.id] = parseFloat(el.value)||0;
      save(); return;
    }
    if(kind==="note"){ S.spend.note = el.value; return; }
    if(kind==="reimb"){ S.spend.reimb = el.value; return; }
    if(kind==="date"){ S.spend.date = el.value || todayISO(); return; }
    if(kind==="cat"){
      var c = S.data.categories.filter(function(x){ return x.id===id; })[0];
      if(!c) return;
      if(field==="name") c.name = el.value; else c.budget = parseFloat(el.value)||0;
      save();
      if(S.tab==="setup") refreshPlanLine();
      return;
    } else if(kind==="rec"){
      var r = S.data.recurring.filter(function(x){ return x.id===id; })[0];
      if(!r) return;
      if(field==="name") r.name = el.value;
      else if(field==="day") r.day = Math.min(Math.max(parseInt(el.value,10)||1,1),31);
      else r.amount = parseFloat(el.value)||0;
    }
    save();
    if(S.tab==="setup") refreshPlanLine();
    return;
  } else if(el.dataset.draft){
    var p = el.dataset.draft.split(":");
    S.draft[p[0]][p[1]] = el.value;
  }
});

document.getElementById("restore").addEventListener("change", function(e){
  var f = e.target.files[0];
  if(!f) return;
  var fr = new FileReader();
  fr.onload = function(){
    try {
      var d = JSON.parse(fr.result);
      if(!d.categories || !d.transactions) throw new Error("shape");
      if(!d.paidBills) d.paidBills={};
      if(!d.unpaidBills) d.unpaidBills={};
      if(!d.amounts) d.amounts={};
      if(!d.snapshots) d.snapshots={};
      if(!d.meta) d.meta={lastBackup:null};
      S.data = d;
      S.spend.catId = d.categories.length ? d.categories[0].id : null;
      save(); S.flash = "Backup restored.";
    } catch(err){ S.flash = "That file isn't a budget backup."; }
    render();
    setTimeout(function(){ S.flash=null; render(); }, 2200);
  };
  fr.readAsText(f);
  e.target.value = "";
});

load();
render();

if("serviceWorker" in navigator){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("./sw.js").catch(function(){});
  });
}
</script>
</body>
</html>
